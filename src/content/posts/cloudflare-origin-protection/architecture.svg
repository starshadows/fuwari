<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare 源站保护链路图</title>
  <desc id="desc">访问者先到 Cloudflare，再由 Cloudflare 回源到 Caddy。源站侧通过 UFW、ufw-docker、Host 校验、Full Strict 和 Authenticated Origin Pulls 限制直接访问。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#27667b" />
    </marker>
    <linearGradient id="cloud" x1="0" x2="1">
      <stop offset="0" stop-color="#e8f7fb" />
      <stop offset="1" stop-color="#f4f0ff" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d3d4f" flood-opacity="0.12" />
    </filter>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #183642; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 650; }
      .small { font-size: 14px; fill: #42606d; }
      .box { fill: #ffffff; stroke: #b9d7df; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .soft { fill: url(#cloud); stroke: #9bcbd7; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .guard { fill: #fff8ec; stroke: #e5b86f; stroke-width: 2; rx: 14; }
      .line { stroke: #27667b; stroke-width: 4; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .deny { stroke: #d35d5d; stroke-width: 4; stroke-linecap: round; }
      .ok { fill: #eaf7ee; stroke: #88bf93; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect width="1120" height="560" fill="#f7fbfc" />
  <text x="56" y="58" class="title">源站保护不是只藏 IP，而是让源站只信任 Cloudflare</text>
  <text x="56" y="88" class="small">Cloudflare 负责入口，源站同时检查来源 IP、转发规则、TLS、Host 和客户端证书。</text>

  <rect x="64" y="178" width="185" height="118" class="box" />
  <text x="156" y="225" text-anchor="middle" class="label">访问者</text>
  <text x="156" y="255" text-anchor="middle" class="small">浏览器 / 外部请求</text>

  <rect x="340" y="142" width="250" height="190" class="soft" />
  <text x="465" y="190" text-anchor="middle" class="label">Cloudflare</text>
  <text x="465" y="222" text-anchor="middle" class="small">橙云代理</text>
  <text x="465" y="250" text-anchor="middle" class="small">Full Strict 回源</text>
  <text x="465" y="278" text-anchor="middle" class="small">Authenticated Origin Pulls</text>

  <rect x="690" y="128" width="320" height="218" class="box" />
  <text x="850" y="178" text-anchor="middle" class="label">源站 EC2</text>
  <text x="850" y="210" text-anchor="middle" class="small">Docker + Caddy</text>
  <text x="850" y="238" text-anchor="middle" class="small">只响应 aaa.454849.xyz</text>
  <text x="850" y="266" text-anchor="middle" class="small">Origin CA 证书</text>
  <text x="850" y="294" text-anchor="middle" class="small">要求 Cloudflare 客户端证书</text>

  <path d="M250 237 H335" class="line" />
  <path d="M592 237 H684" class="line" />

  <rect x="690" y="386" width="320" height="86" class="guard" />
  <text x="850" y="420" text-anchor="middle" class="label">UFW + ufw-docker</text>
  <text x="850" y="449" text-anchor="middle" class="small">80/443 只允许 Cloudflare IP，容器转发也纳入 UFW</text>

  <path d="M850 386 V350" class="line" />

  <path d="M148 330 C180 430, 450 500, 700 455" class="deny" />
  <path d="M703 455 l-22 -10 m22 10 l-16 18" class="deny" />
  <text x="310" y="468" class="small" fill="#b44646">直接打源站 IP / 伪造 Host：被防火墙、Host 校验或 mTLS 拦住</text>

  <rect x="82" y="376" width="236" height="56" class="ok" />
  <text x="200" y="410" text-anchor="middle" class="small">正常路径：域名访问 Cloudflare</text>

  <rect x="376" y="376" width="254" height="72" class="ok" />
  <text x="503" y="407" text-anchor="middle" class="small">Cloudflare 校验证源站证书</text>
  <text x="503" y="430" text-anchor="middle" class="small">源站校验 Cloudflare 客户端证书</text>
</svg>
