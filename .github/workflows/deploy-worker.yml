name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]
    paths:
      - "migrations/**"
      - ".github/workflows/deploy-worker.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "!src/worker/__tests__/**"
      - "wrangler.jsonc"

permissions:
  contents: read

env:
  NODE_VERSION: 24.13.1
  PNPM_VERSION: 9.14.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN is not configured."
          fi

      - name: Apply D1 migrations
        if: steps.cloudflare-credentials.outputs.configured == 'true'
        run: pnpm wrangler d1 migrations apply fuwari-data --remote --yes

      - name: Deploy Worker
        if: steps.cloudflare-credentials.outputs.configured == 'true'
        run: pnpm worker:deploy
